<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Raftaar Racer — Play</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
#gameNav{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;
  background:#0a0a0a;border-bottom:1px solid #1a1a1a;font-family:'Orbitron',monospace;font-size:9px}

.nav-guest{color:#444;letter-spacing:1px}

<body>
<div id="gameNav">
  <span id="navUser" class="nav-guest">GUEST MODE</span>
  <div class="nav-btns">
    <a href="/" class="nav-btn">⬅ HOME</a>
    <a href="/" id="navLbBtn" class="nav-btn">🏆 LEADERBOARD</a>
  </div>
</div>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#060608;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-family:'Orbitron',monospace}
#gameCanvas{display:block;image-rendering:pixelated;border:2px solid #222;box-shadow:0 0 60px #ff440033,0 0 120px #00000099;touch-action:none;transition:border-color .4s,box-shadow .4s}
#gameCanvas.night-mode{border-color:#001133;box-shadow:0 0 60px #0044ff22,0 0 120px #00000099}
#ui{width:100%;max-width:380px;padding:0 6px;margin-top:7px;display:flex;flex-direction:column;gap:5px}
#controls{display:flex;gap:8px}
.btn{flex:1;height:56px;border-radius:12px;border:none;font-size:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:manipulation;user-select:none;transition:transform .08s,filter .08s,opacity .2s}
.btn span{font-size:7px;letter-spacing:1px;opacity:.65;font-family:'Orbitron',monospace}
.btn:active,.btn.on{transform:scale(.86);filter:brightness(1.6)}
#bL{background:linear-gradient(135deg,#1a2a4a,#0d1a33);border:2px solid #2255aa;color:#88bbff}
#bR{background:linear-gradient(135deg,#1a2a4a,#0d1a33);border:2px solid #2255aa;color:#88bbff}
#bG{background:linear-gradient(135deg,#3a1a00,#220f00);border:2px solid #cc4400;color:#ff8833}
#bB{background:linear-gradient(135deg,#2a0000,#1a0000);border:2px solid #880000;color:#ff4444}
.btn-dimmed{opacity:.3}
#row2{display:flex;gap:7px;align-items:center;justify-content:flex-end}
#btnSound{width:48px;height:34px;border-radius:9px;border:2px solid #444;background:#111;color:#888;font-size:15px;cursor:pointer;transition:all .2s;flex-shrink:0}
#btnSound.on{border-color:#ffcc00;color:#ffcc00}
</style>
<canvas id="gameCanvas"></canvas>
<div id="ui">
  <div id="controls">
    <button class="btn" id="bL">&#9664;<span>LEFT</span></button>
    <button class="btn" id="bR">&#9654;<span>RIGHT</span></button>
    <button class="btn" id="bG">&#9650;<span>GAS</span></button>
    <button class="btn" id="bB">&#9660;<span>BRAKE</span></button>
  </div>
  <div id="row2">
    <button id="btnSound" class="on">&#128266;</button>
  </div>
</div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
let audioCtx=null,engineGain=null,engineOsc=null,soundOn=true;
function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    engineGain=audioCtx.createGain();engineGain.gain.value=0;
    engineOsc=audioCtx.createOscillator();engineOsc.type='sawtooth';engineOsc.frequency.value=80;
    const dist=audioCtx.createWaveShaper();
    const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i*2/256-1;c[i]=x<0?-Math.pow(-x,.7):Math.pow(x,.7);}
    dist.curve=c;engineOsc.connect(dist);dist.connect(engineGain);engineGain.connect(audioCtx.destination);
    engineOsc.start();
  }catch(e){}
}
function setEngine(s,mx){
  if(!audioCtx||!soundOn){if(engineGain)engineGain.gain.value=0;return;}
  try{const t=audioCtx.currentTime;engineGain.gain.linearRampToValueAtTime(0.08,t+.05);engineOsc.frequency.linearRampToValueAtTime(60+s/mx*180,t+.1);}catch(e){}
}
function beep(type){
  if(!audioCtx||!soundOn)return;
  try{
    const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    const cfg={
      coin:[440,'sine',.2,.2,[880,1320]],
      fuel:[330,'sine',.25,.3,[440,660,880]],
      powerup:[330,'square',.18,.4,[330,1320]],
      crash:[200,'sawtooth',.4,.5,[200,40]],
      level:[330,'square',.15,.15,null],
      shield:[220,'sine',.18,.4,[220,110]]
    }[type];
    if(!cfg)return;
    o.type=cfg[1];o.frequency.setValueAtTime(cfg[4]?cfg[4][0]:cfg[0],t);
    if(cfg[4]&&cfg[4].length>1)o.frequency.exponentialRampToValueAtTime(cfg[4][cfg[4].length-1],t+cfg[3]*.8);
    g.gain.setValueAtTime(cfg[2],t);g.gain.exponentialRampToValueAtTime(.001,t+cfg[3]);
    o.start(t);o.stop(t+cfg[3]);
    if(type==='level'){[0,.1,.2,.3].forEach((d,i)=>{const oo=audioCtx.createOscillator(),gg=audioCtx.createGain();oo.connect(gg);gg.connect(audioCtx.destination);oo.type='square';oo.frequency.value=[330,440,550,660][i];gg.gain.setValueAtTime(.14,t+d);gg.gain.exponentialRampToValueAtTime(.001,t+d+.15);oo.start(t+d);oo.stop(t+d+.2);});}
  }catch(e){}
}
document.getElementById('btnSound').addEventListener('click',()=>{
  soundOn=!soundOn;
  const b=document.getElementById('btnSound');b.textContent=soundOn?'\u{1F50A}':'\u{1F507}';b.classList.toggle('on',soundOn);
  if(engineGain)engineGain.gain.value=0;
});

// ═══════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const BW=320,BH=480;let scale=1;
function resize(){
  const mh=window.innerHeight-document.getElementById('ui').offsetHeight-18;
  const mw=window.innerWidth-8;
  scale=Math.min(mw/BW,mh/BH,2.4);
  canvas.width=BW;canvas.height=BH;
  canvas.style.width=(BW*scale)+'px';canvas.style.height=(BH*scale)+'px';
}
resize();window.addEventListener('resize',resize);

// ═══════════════════════════════════════════════════════
// CONSTANTS & HELPERS
// ═══════════════════════════════════════════════════════
const RX=58,RW=204,RR=RX+RW,LW=RW/4;
const LANES=[0,1,2,3].map(i=>RX+LW*i+LW/2-16);
const MAX_SPD=10,PLW=32,PLH=46,PLY=BH-88;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function lerpc(c1,c2,t){
  const h=s=>{const v=parseInt(s,16);return[v>>16&255,v>>8&255,v&255];};
  const a=h(c1.slice(1)),b=h(c2.slice(1));
  return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function hit(ax,ay,aw,ah,bx,by,bw,bh){return!(ax+aw<bx||ax>bx+bw||ay+ah<by||ay>by+bh);}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}

// ═══════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════
const SK='raftaar_v1';
function loadS(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch(e){return{};}}
function saveS(o){localStorage.setItem(SK,JSON.stringify({...loadS(),...o}));}
let sv=loadS();
let highScore=sv.hs||0,totalCoins=sv.coins||0,unlockedCars=sv.cars||[0],activeCar=sv.activeCar||0;

// leaderboard
function getLB(){try{return JSON.parse(localStorage.getItem('raftaar_lb'))||[];}catch(e){return[];}}
function addLB(sc){let lb=getLB();lb.push({sc,date:new Date().toLocaleDateString()});lb.sort((a,b)=>b.sc-a.sc);localStorage.setItem('raftaar_lb',JSON.stringify(lb.slice(0,5)));}

// ═══════════════════════════════════════════════════════
// CARS
// ═══════════════════════════════════════════════════════
const CARS=[
  {name:'RACER',  cost:0,  col:'#dd1111',str:'#ff3333',roof:'#aa0000',win:'#b8e4ff'},
  {name:'PHANTOM',cost:200,col:'#1144dd',str:'#3366ff',roof:'#0a2288',win:'#c0e8ff'},
  {name:'VIPER',  cost:400,col:'#118833',str:'#22cc55',roof:'#085522',win:'#aaddcc'},
  {name:'SHADOW', cost:600,col:'#441188',str:'#8833ff',roof:'#220055',win:'#ddaaff'},
  {name:'BLAZE',  cost:800,col:'#dd7700',str:'#ffaa00',roof:'#994400',win:'#ffe8aa'},
];

// ═══════════════════════════════════════════════════════
// DRAW FUNCTIONS
// ═══════════════════════════════════════════════════════
function drawPlayer(x,y,ci){
  const c=CARS[ci??activeCar];
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(x+16,y+50,14,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=c.col;rr(x+3,y+8,26,34,5);ctx.fillStyle=c.str;rr(x+3,y+18,26,8,0);
  ctx.fillStyle=c.roof;rr(x+7,y+12,18,14,3);ctx.fillStyle=c.win;rr(x+9,y+13,14,9,2);
  ctx.fillStyle='#88c0dd';rr(x+9,y+23,14,5,1);
  [[x+4,y+12],[x+28,y+12],[x+4,y+36],[x+28,y+36]].forEach(([wx,wy])=>{
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(wx,wy,5,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(wx,wy,2,3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#888';ctx.beginPath();ctx.ellipse(wx,wy,1,1.5,0,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#ffffaa';ctx.fillRect(x+6,y+8,5,3);ctx.fillRect(x+21,y+8,5,3);
  ctx.fillStyle='#ff2200';ctx.fillRect(x+6,y+41,5,3);ctx.fillRect(x+21,y+41,5,3);
}
function drawEnemy(x,y,col,roof){
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x+16,y+48,13,4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col;rr(x+3,y+4,26,36,5);ctx.fillStyle=roof;rr(x+6,y+10,20,12,3);
  ctx.fillStyle='#c8e8ff';rr(x+8,y+11,16,8,2);
  [[x+4,y+10],[x+28,y+10],[x+4,y+34],[x+28,y+34]].forEach(([wx,wy])=>{
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(wx,wy,5,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(wx,wy,2,3,0,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#ffff44';ctx.fillRect(x+6,y+38,6,3);ctx.fillRect(x+20,y+38,6,3);
}
function drawTruck(x,y){
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(x+16,y+52,14,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#999';rr(x+2,y+2,28,22,2);ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.strokeRect(x+4,y+4,24,16);
  ctx.fillStyle='#bbb';ctx.fillRect(x+5,y+5,10,14);ctx.fillStyle='#664400';rr(x+3,y+22,26,22,4);
  ctx.fillStyle='#ffee88';rr(x+6,y+23,20,10,2);
  [[x+4,y+34],[x+28,y+34],[x+4,y+14],[x+28,y+14]].forEach(([wx,wy])=>{
    ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(wx,wy,5,6,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#444';ctx.beginPath();ctx.ellipse(wx,wy,2,3,0,0,Math.PI*2);ctx.fill();
  });
}
function drawFuelCan(x,y){
  ctx.save();
  const g=ctx.createRadialGradient(x+16,y+22,4,x+16,y+22,22);
  g.addColorStop(0,'rgba(255,200,0,0.4)');g.addColorStop(1,'rgba(255,200,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x+16,y+22,24,22,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8b800';rr(x+4,y+10,24,28,4);ctx.fillStyle='#ffe44f';rr(x+7,y+12,8,14,2);
  ctx.fillStyle='#cc1100';ctx.fillRect(x+4,y+22,24,6);
  ctx.fillStyle='#fff';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText('FUEL',x+16,y+27);
  ctx.fillStyle='#555';rr(x+9,y+5,14,6,2);ctx.fillStyle='#444';rr(x+7,y+5,18,4,2);
  ctx.strokeStyle='#b8900a';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x+8,y+10);ctx.lineTo(x+8,y+4);ctx.lineTo(x+24,y+4);ctx.lineTo(x+24,y+10);ctx.stroke();
  ctx.fillStyle='#333';rr(x+20,y+3,8,4,2);ctx.fillStyle='#cc9900';rr(x+4,y+34,24,4,3);
  ctx.strokeStyle='rgba(255,220,80,0.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x+4,y+10,24,28,4);ctx.stroke();
  ctx.restore();
}
function drawCoin(x,y,t){
  ctx.save();const p=0.88+Math.sin(t*0.08)*0.12;
  const g=ctx.createRadialGradient(x+8,y+8,2,x+8,y+8,14);
  g.addColorStop(0,'rgba(255,220,0,0.5)');g.addColorStop(1,'rgba(255,220,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x+8,y+8,14,14,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.ellipse(x+8,y+8,8*p,8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ffe044';ctx.beginPath();ctx.ellipse(x+6,y+6,3*p,3,0,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#ffdd44';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x+8,y+8,7*p,7,0,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='#996600';ctx.font='bold 7px monospace';ctx.textAlign='center';ctx.fillText('$',x+8,y+11);
  ctx.restore();
}
function drawPU(x,y,kind,t){
  ctx.save();const p=0.9+Math.sin(t*0.07)*0.1;
  const cols={shield:'#00aaff',boost:'#ff6600',slowmo:'#aa00ff'};
  const lbl={shield:'\u{1F6E1}',boost:'\u26A1',slowmo:'\u23F1'};
  const col=cols[kind];
  const g=ctx.createRadialGradient(x+14,y+14,3,x+14,y+14,18);
  g.addColorStop(0,col+'99');g.addColorStop(1,col+'00');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x+14,y+14,18,18,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=col+'44';ctx.beginPath();ctx.roundRect(x+2,y+2,24,24,6);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x+2,y+2,24,24,6);ctx.stroke();
  ctx.font=`${14*p}px monospace`;ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(lbl[kind],x+14,y+19);
  ctx.restore();
}
function drawShield(x,y,t){
  ctx.save();const a=0.3+Math.sin(t*0.15)*0.2;
  ctx.strokeStyle=`rgba(0,180,255,${a+0.4})`;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x+16,y+24,22,28,0,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function drawExplosion(x,y,f){
  const r=f*3.5+6,a=1-f/22;
  ctx.save();ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(x+16,y+20,0,x+16,y+20,r);
  g.addColorStop(0,'#fff');g.addColorStop(.3,'#ffcc00');g.addColorStop(.7,'#ff4400');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x+16,y+20,r,0,Math.PI*2);ctx.fill();
  for(let i=0;i<10;i++){const a2=i/10*Math.PI*2,sr=r*.85;ctx.fillStyle=i%2?'#ffaa00':'#ff5500';ctx.beginPath();ctx.arc(x+16+Math.cos(a2)*sr,y+20+Math.sin(a2)*sr,2.5,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// ROAD
// ═══════════════════════════════════════════════════════
let roadOff=0;
function drawRoad(spd,night,rain){
  const n=night||0,r=rain||0;
  ctx.fillStyle=lerpc('#0d1a0d','#030510',n);ctx.fillRect(0,0,BW,BH);
  ctx.fillStyle=lerpc('#0b3b0b','#050a1a',n);ctx.fillRect(0,0,RX,BH);ctx.fillRect(RR,0,BW-RR,BH);
  ctx.strokeStyle=lerpc('#0e4e0e','#080e2a',n);ctx.lineWidth=1;
  for(let y=(roadOff*1.8)%28-28;y<BH;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(RX,y);ctx.stroke();ctx.beginPath();ctx.moveTo(RR,y);ctx.lineTo(BW,y);ctx.stroke();}
  ctx.fillStyle=lerpc('#3c3c3c','#1a1a2e',n);ctx.fillRect(RX,0,RW,BH);
  const rg=ctx.createLinearGradient(RX,0,RR,0);rg.addColorStop(0,'rgba(0,0,0,0.35)');rg.addColorStop(.5,'rgba(0,0,0,0)');rg.addColorStop(1,'rgba(0,0,0,0.35)');ctx.fillStyle=rg;ctx.fillRect(RX,0,RW,BH);
  ctx.fillStyle=lerpc('#ffffff','#aaaacc',n);ctx.fillRect(RX,0,5,BH);ctx.fillRect(RR-5,0,5,BH);
  const dash=36,gap=20,per=dash+gap,cx2=RX+RW/2-2;
  ctx.fillStyle=lerpc('#ffee00','#4444aa',n);
  for(let y=(roadOff%per)-per;y<BH;y+=per)ctx.fillRect(cx2,y,4,dash);
  ctx.fillStyle='rgba(255,255,255,0.18)';
  [RX+LW,RX+LW*2,RX+LW*3].forEach(lx=>{for(let y=(roadOff%per)-per;y<BH;y+=per)ctx.fillRect(lx-1,y,2,18);});
  roadOff=(roadOff+spd*0.55)%10000;
  if(n>0){ctx.fillStyle=`rgba(0,0,10,${n*0.65})`;ctx.fillRect(0,0,BW,BH);const cone=ctx.createRadialGradient(BW/2,PLY+20,5,BW/2,PLY,180);cone.addColorStop(0,`rgba(255,240,200,${n*0.16})`);cone.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=cone;ctx.fillRect(RX,0,RW,BH);}
  if(r>0&&!paused){ctx.save();ctx.globalAlpha=r*0.55;ctx.strokeStyle='#aaccff';ctx.lineWidth=1;for(let i=0;i<38;i++){const rx=RX+Math.random()*RW,ry=Math.random()*BH;ctx.beginPath();ctx.moveTo(rx,ry);ctx.lineTo(rx-2,ry+12);ctx.stroke();}ctx.restore();}
}

// ═══════════════════════════════════════════════════════
// SKID MARKS
// ═══════════════════════════════════════════════════════
let skids=[];
function addSkid(x,braking){if(!braking||Math.random()>0.4)return;skids.push({x:x+8,x2:x+24,y:PLY+40,a:0.5});if(skids.length>60)skids.shift();}
function drawSkids(){skids.forEach(s=>{ctx.fillStyle=`rgba(20,20,20,${s.a})`;ctx.fillRect(s.x,s.y,3,6);ctx.fillRect(s.x2,s.y,3,6);s.a-=0.002;});skids=skids.filter(s=>s.a>0);}

// ═══════════════════════════════════════════════════════
// REARVIEW MIRROR
// ═══════════════════════════════════════════════════════
function drawMirror(enemies){
  const mx=BW/2-28,my=BH-74,mw=56,mh=20;
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.75)';ctx.beginPath();ctx.roundRect(mx,my,mw,mh,4);ctx.fill();
  ctx.strokeStyle='#777';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(mx,my,mw,mh,4);ctx.stroke();
  ctx.beginPath();ctx.roundRect(mx+1,my+1,mw-2,mh-2,3);ctx.clip();
  ctx.fillStyle='#222';ctx.fillRect(mx,my,mw,mh);
  ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(mx+20,my,2,mh);ctx.fillRect(mx+34,my,2,mh);
  enemies.slice(0,4).forEach(o=>{if(o.y<PLY)return;const ex=mx+4+(o.x-RX)/RW*(mw-8),ey=my+3;ctx.fillStyle='#ff4444';ctx.fillRect(ex,ey,7,5);});
  ctx.restore();ctx.fillStyle='#555';ctx.font='5px monospace';ctx.textAlign='center';ctx.fillText('REAR',BW/2,BH-57);
}

// ═══════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════
function drawHUD(sc,hs,lv,fuel,spd,shT,boT,slT,night){
  ctx.fillStyle=`rgba(0,0,${Math.round(night*20)},0.84)`;ctx.fillRect(0,0,BW,58);
  ctx.strokeStyle='rgba(255,204,0,0.15)';ctx.lineWidth=1;ctx.strokeRect(0,0,BW,58);
  ctx.fillStyle='#ffcc00';ctx.font='bold 8px Orbitron,monospace';ctx.textAlign='left';ctx.fillText('SCORE',6,12);
  ctx.fillStyle='#fff';ctx.font='bold 14px Orbitron,monospace';ctx.fillText(String(sc).padStart(7,'0'),6,27);
  ctx.fillStyle='#ffcc00';ctx.font='bold 8px Orbitron,monospace';ctx.textAlign='center';ctx.fillText('BEST',BW/2,12);
  ctx.fillStyle='#88ff88';ctx.font='bold 14px Orbitron,monospace';ctx.fillText(String(hs).padStart(7,'0'),BW/2,27);
  ctx.fillStyle='#ffcc00';ctx.font='bold 8px Orbitron,monospace';ctx.textAlign='right';ctx.fillText('LVL',BW-6,12);
  ctx.fillStyle='#00ffff';ctx.font='bold 14px Orbitron,monospace';ctx.fillText(lv,BW-6,27);
  // fuel bar
  const fx=6,fy=36,fw=128,fh=11;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(fx,fy,fw,fh);
  const fp=Math.max(0,fuel/100),fc=fp>.5?'#00dd44':fp>.25?'#ffaa00':'#ff2200';
  if(fp<=.25){ctx.shadowColor=fc;ctx.shadowBlur=8;}
  ctx.fillStyle=fc;ctx.fillRect(fx,fy,fw*fp,fh);ctx.shadowBlur=0;
  ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(fx,fy,fw,fh);
  ctx.fillStyle='#ffcc00';ctx.font='bold 7px monospace';ctx.textAlign='left';ctx.fillText('FUEL',fx,fy-1);
  // speed bar
  const sx=BW/2+6,sw=BW/2-12;
  ctx.fillStyle='#1a1a1a';ctx.fillRect(sx,fy,sw,fh);ctx.fillStyle='#00aaff';ctx.fillRect(sx,fy,sw*(spd/MAX_SPD),fh);
  ctx.strokeStyle='#444';ctx.lineWidth=1;ctx.strokeRect(sx,fy,sw,fh);
  ctx.fillStyle='#00ccff';ctx.font='bold 7px monospace';ctx.textAlign='left';ctx.fillText('SPD '+spd.toFixed(1),sx,fy-1);
  // coins
  ctx.fillStyle='#ffcc00';ctx.font='bold 8px Orbitron,monospace';ctx.textAlign='right';ctx.fillText('$ '+String(totalCoins).padStart(4,'0'),BW-4,54);
  // powerup bars
  let px=4;
  [[shT,300,'rgba(0,100,200,0.85)','#00aaff','\u{1F6E1} SHIELD'],[boT,240,'rgba(200,80,0,0.85)','#ff6600','\u26A1 BOOST'],[slT,300,'rgba(100,0,200,0.85)','#aa00ff','\u23F1 SLOW']].forEach(([tm,mx2,bg,fg,lb])=>{
    if(tm<=0)return;
    ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(px,59,38,11,3);ctx.fill();
    ctx.fillStyle=fg;ctx.fillRect(px+1,60,(36)*(tm/mx2),9);
    ctx.fillStyle='#fff';ctx.font='bold 6px monospace';ctx.textAlign='center';ctx.fillText(lb,px+19,68);px+=42;
  });
}

const MISSIONS=[
  {id:'d5',   lbl:'Dodge 5 cars',    key:'dodged',target:5,  reward:30},
  {id:'f3',   lbl:'Grab 3 fuels',    key:'fuels', target:3,  reward:25},
  {id:'c10',  lbl:'Collect 10 coins',key:'coins', target:10, reward:40},
  {id:'lv3',  lbl:'Reach level 3',   key:'level', target:3,  reward:50},
  {id:'s500', lbl:'Score 500 pts',   key:'score', target:500,reward:60},
  {id:'t60',  lbl:'Survive 60 sec',  key:'time',  target:60, reward:50},
];
function pickM(){return MISSIONS[Math.floor(Math.random()*MISSIONS.length)];}

function drawMissionBar(m,prog){
  if(!m)return;const pct=Math.min(1,(prog||0)/m.target);
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.62)';ctx.beginPath();ctx.roundRect(BW-114,72,112,26,5);ctx.fill();
  ctx.strokeStyle='#ffcc0040';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(BW-114,72,112,26,5);ctx.stroke();
  ctx.fillStyle='#ffcc00';ctx.font='bold 6px monospace';ctx.textAlign='left';ctx.fillText('MISSION: '+m.lbl,BW-111,82);
  ctx.fillStyle='#222';ctx.fillRect(BW-111,85,106,5);ctx.fillStyle='#ffcc00';ctx.fillRect(BW-111,85,106*pct,5);
  ctx.fillStyle='#888';ctx.font='6px monospace';ctx.textAlign='right';ctx.fillText((prog||0)+'/'+m.target,BW-6,90);
  ctx.restore();
}

}

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
const S={START:0,PLAYING:1,GAMEOVER:2};
let state=S.START,paused=false;
let playerX,spd,fuel,score,level,prevLevel;
let enemies,fuels_arr,coins_arr,pups_arr,explosions,popups;
let spawnCd,fuelCd,coinCd,puCd,lt;
let shT=0,boT=0,slT=0,nightLv=0,rainLv=0;
let mission,mProg={},mDone=false,sesCoins=0,frameT=0,aliveT=0;

const ETYPES=[
  {draw:(x,y)=>drawEnemy(x,y,'#1a44cc','#0e2d88'),w:32,h:44},
  {draw:(x,y)=>drawEnemy(x,y,'#228833','#165520'),w:32,h:44},
  {draw:(x,y)=>drawEnemy(x,y,'#882288','#551155'),w:32,h:44},
  {draw:(x,y)=>drawEnemy(x,y,'#887722','#554d11'),w:32,h:44},
  {draw:(x,y)=>drawEnemy(x,y,'#cc3311','#881100'),w:32,h:44},
  {draw:(x,y)=>drawTruck(x,y),w:32,h:52},
];

function initGame(){
  playerX=LANES[1];spd=3;fuel=100;score=0;level=1;prevLevel=1;
  enemies=[];fuels_arr=[];coins_arr=[];pups_arr=[];explosions=[];popups=[];skids=[];
  spawnCd=60;fuelCd=140;coinCd=80;puCd=300;paused=false;
  shT=0;boT=0;slT=0;nightLv=0;rainLv=0;frameT=0;aliveT=0;sesCoins=0;
  mission=pickM();mProg={};mDone=false;mProg[mission.key]=0;
  lt=performance.now();
}

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
const keys={left:false,right:false,gas:false,brake:false};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')keys.left=true;if(e.key==='ArrowRight')keys.right=true;
  if(e.key==='ArrowUp')keys.gas=true;if(e.key==='ArrowDown')keys.brake=true;
  if((e.key==='p'||e.key==='P')&&state===S.PLAYING)paused=!paused;
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')keys.left=false;if(e.key==='ArrowRight')keys.right=false;
  if(e.key==='ArrowUp')keys.gas=false;if(e.key==='ArrowDown')keys.brake=false;
});
function bindBtn(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.classList.add('on');});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>{keys[key]=false;el.classList.remove('on');}));
}
bindBtn('bL','left');bindBtn('bR','right');bindBtn('bG','gas');bindBtn('bB','brake');

canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect(),cx=(e.clientX-r.left)/scale,cy=(e.clientY-r.top)/scale;
  initAudio();
  if(state===S.START){
    if(menuTab==='start'){
      if(cx>=BW/2-72&&cx<=BW/2+72&&cy>=350&&cy<=386){initGame();state=S.PLAYING;requestAnimationFrame(loop);}
      else if(cx>=BW/2-118&&cx<=BW/2-50&&cy>=396&&cy<=424){menuTab='garage';}
      else if(cx>=BW/2+50&&cx<=BW/2+118&&cy>=396&&cy<=424){menuTab='scores';}
    }else{
      if(cy>=446&&cy<=472){menuTab='start';}
      else if(menuTab==='garage'){
        CARS.forEach((car,i)=>{
          const row=Math.floor(i/2),col=i%2,gx=34+col*130,gy=62+row*106;
          if(cx>=gx&&cx<=gx+110&&cy>=gy&&cy<=gy+94){
            if(unlockedCars.includes(i)){activeCar=i;saveS({activeCar});}
            else if(totalCoins>=car.cost){totalCoins-=car.cost;unlockedCars.push(i);activeCar=i;saveS({coins:totalCoins,cars:unlockedCars,activeCar});}
          }
        });
      }
    }
  }else if(state===S.GAMEOVER){
    if(cx>=BW/2-86&&cx<=BW/2+86&&cy>=342&&cy<=380){initGame();state=S.PLAYING;requestAnimationFrame(loop);}
    else if(cx>=BW/2-70&&cx<=BW/2+70&&cy>=390&&cy<=422){menuTab='scores';state=S.START;}
  }
});

// ═══════════════════════════════════════════════════════
// HAPTIC + SHAKE
// ═══════════════════════════════════════════════════════
let shakePow=0,shakeT=0;
function applyShake(dt){
  if(shakeT<=0){canvas.style.transform='';return;}
  shakeT-=dt;const d=shakeT>0?shakePow*(shakeT/10):0;
  canvas.style.transform=`translate(${(Math.random()*2-1)*d}px,${(Math.random()*2-1)*d}px)`;
}

// ═══════════════════════════════════════════════════════
// MISSION TRACKING
// ═══════════════════════════════════════════════════════
function trackM(key,val){
  if(!mission||mDone)return;
  if(mission.key!==key)return;
  if(key==='score'||key==='level'||key==='time')mProg[key]=Math.max(mProg[key]||0,val);
  else mProg[key]=(mProg[key]||0)+val;
  if(mProg[key]>=mission.target&&!mDone){
    mDone=true;const rw=mission.reward;
    totalCoins+=rw;sesCoins+=rw;saveS({coins:totalCoins});
    popups.push({x:BW/2-64,y:BH/2-20,txt:'MISSION! +$'+rw,a:3.5,c:'#ffcc00',big:true});
    vib([40,20,40,20,80]);beep('level');
  }
}

// ═══════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════
let blinkT=0;
function loop(t){
  if(state!==S.PLAYING)return;
  requestAnimationFrame(loop);
  const dt=Math.min(2,(t-lt)/16.67);lt=t;
  frameT+=dt;aliveT+=dt/60;
  applyShake(dt);

  nightLv=Math.min(1,Math.max(0,(level-3)/6));
  rainLv=Math.min(1,Math.max(0,(level-5)/5));
  canvas.classList.toggle('night-mode',nightLv>0.3);

  const slowMult=slT>0?0.45:1;
  drawSkids();
  drawRoad(paused?0:spd,nightLv,paused?0:rainLv);

  if(paused){
    enemies.forEach(o=>o.type.draw(o.x,o.y));
    fuels_arr.forEach(o=>drawFuelCan(o.x,o.y));
    coins_arr.forEach(o=>drawCoin(o.x,o.y,frameT));
    pups_arr.forEach(o=>drawPU(o.x,o.y,o.kind,frameT));
    if(shT>0)drawShield(playerX,PLY,frameT);
    drawPlayer(playerX,PLY);drawMirror(enemies);
    drawHUD(score,highScore,level,fuel,spd,shT,boT,slT,nightLv);
    drawMissionBar(mission,mProg[mission?.key]);
    ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,0,BW,BH);
    ctx.shadowColor='#00ffff';ctx.shadowBlur=16;ctx.fillStyle='#00ffff';ctx.font='bold 28px Orbitron,monospace';ctx.textAlign='center';ctx.fillText('PAUSED',BW/2,BH/2);ctx.shadowBlur=0;
    ctx.fillStyle='#888';ctx.font='9px monospace';ctx.fillText('Press P to continue',BW/2,BH/2+26);
    return;
  }

  const spdMult=boT>0?1.4:1;
  playerX+=((keys.right?1:0)-(keys.left?1:0))*5.5*dt*spdMult;
  playerX=Math.max(RX+3,Math.min(RR-PLW-3,playerX));
  if(keys.gas)spd+=0.04*dt;
  if(keys.brake)spd-=0.07*dt;
  spd=Math.max(2,Math.min(MAX_SPD*(boT>0?1.3:1),spd));
  fuel-=0.026*spd*dt;fuel=Math.max(0,fuel);
  if(fuel<=0){endGame();return;}

  if(shT>0)shT-=dt;if(boT>0)boT-=dt;if(slT>0)slT-=dt;
  setEngine(spd,MAX_SPD*(boT>0?1.3:1));
  addSkid(playerX,keys.brake&&spd>3);

  // spawns
  spawnCd-=dt;if(spawnCd<=0){const lane=Math.random()*4|0,type=ETYPES[Math.random()*ETYPES.length|0];enemies.push({x:LANES[lane],y:-55,type});spawnCd=Math.max(14,62-level*3);}
  fuelCd-=dt;if(fuelCd<=0){fuels_arr.push({x:LANES[Math.random()*4|0],y:-52});fuelCd=100+Math.random()*80;}
  coinCd-=dt;if(coinCd<=0){coins_arr.push({x:LANES[Math.random()*4|0]+4,y:-20});coinCd=48+Math.random()*55;}
  puCd-=dt;if(puCd<=0){const kinds=['shield','boost','slowmo'];pups_arr.push({x:LANES[Math.random()*4|0],y:-32,kind:kinds[Math.floor(Math.random()*3)]});puCd=340+Math.random()*200;}

  // enemies
  let crash=false;
  enemies=enemies.filter(o=>{
    o.y+=spd*dt*slowMult;o.type.draw(o.x,o.y);
    if(hit(playerX+5,PLY+5,PLW-10,PLH-8,o.x+5,o.y+4,o.type.w-10,o.type.h-8)){
      if(shT>0){shT=0;popups.push({x:o.x-8,y:o.y,txt:'\u{1F6E1} BLOCKED!',a:2,c:'#00aaff'});beep('shield');vib([20,10,20]);return false;}
      crash=true;
    }
    if(o.y>BH){score+=10;trackM('dodged',1);popups.push({x:o.x+6,y:BH-14,txt:'+10',a:1,c:'#00ffff'});return false;}
    return true;
  });

  // fuel
  fuels_arr=fuels_arr.filter(o=>{
    o.y+=spd*0.88*dt*slowMult;drawFuelCan(o.x,o.y);
    if(hit(playerX+5,PLY+5,PLW-10,PLH-8,o.x+3,o.y+8,26,28)){
      fuel=Math.min(100,fuel+30);trackM('fuels',1);
      popups.push({x:o.x,y:o.y,txt:'FUEL +30',a:1.5,c:'#ffcc00'});
      shakePow=5;shakeT=10;vib([40]);beep('fuel');return false;
    }
    return o.y<=BH;
  });

  // coins
  coins_arr=coins_arr.filter(o=>{
    o.y+=spd*0.75*dt*slowMult;drawCoin(o.x,o.y,frameT);
    if(hit(playerX+5,PLY+5,PLW-10,PLH-8,o.x,o.y,16,16)){
      totalCoins+=1;sesCoins+=1;score+=5;trackM('coins',1);saveS({coins:totalCoins});
      popups.push({x:o.x,y:o.y,txt:'+$1',a:1.2,c:'#ffee00'});vib([15]);beep('coin');return false;
    }
    return o.y<=BH;
  });

  // powerups
  pups_arr=pups_arr.filter(o=>{
    o.y+=spd*0.7*dt*slowMult;drawPU(o.x,o.y,o.kind,frameT);
    if(hit(playerX+5,PLY+5,PLW-10,PLH-8,o.x+2,o.y+2,24,24)){
      if(o.kind==='shield'){shT=300;popups.push({x:o.x-8,y:o.y,txt:'\u{1F6E1} SHIELD!',a:2,c:'#00aaff'});}
      else if(o.kind==='boost'){boT=240;popups.push({x:o.x-8,y:o.y,txt:'\u26A1 BOOST!',a:2,c:'#ff6600'});}
      else{slT=300;popups.push({x:o.x-8,y:o.y,txt:'\u23F1 SLOW-MO!',a:2,c:'#aa00ff'});}
      shakePow=6;shakeT=12;vib([30,20,60]);beep('powerup');return false;
    }
    return o.y<=BH;
  });

  // player render
  if(shT>0)drawShield(playerX,PLY,frameT);
  drawPlayer(playerX,PLY);

  // boost/gas flame
  if(keys.gas||boT>0){
    const fs=(boT>0?14:8)+Math.random()*6;
    [[playerX+8,PLY+PLH],[playerX+20,PLY+PLH]].forEach(([fx,fy])=>{
      const fg=ctx.createLinearGradient(fx,fy,fx,fy+fs);fg.addColorStop(0,'#fff');fg.addColorStop(.4,boT>0?'#00aaff':'#ffcc00');fg.addColorStop(1,'rgba(255,80,0,0)');
      ctx.fillStyle=fg;ctx.beginPath();ctx.ellipse(fx,fy,boT>0?5:3.5,fs,0,0,Math.PI*2);ctx.fill();
    });
  }

  drawMirror(enemies);
  explosions=explosions.filter(e=>{drawExplosion(e.x,e.y,e.frame);e.frame++;return e.frame<24;});

  popups=popups.filter(p=>{
    ctx.globalAlpha=Math.min(1,p.a);
    ctx.fillStyle=p.c;ctx.font=p.big?'bold 12px Orbitron,monospace':'bold 9px Orbitron,monospace';
    ctx.textAlign='center';ctx.fillText(p.txt,p.x+20,p.y);
    ctx.globalAlpha=1;p.y-=1.4;p.a-=0.020;return p.a>0;
  });

  level=1+Math.floor(score/400);
  if(level>prevLevel){
    popups.push({x:BW/2-50,y:BH/2,txt:'LEVEL '+level+'!',a:2.5,c:'#ffcc00',big:true});
    prevLevel=level;beep('level');vib([50,30,100]);
  }

  trackM('score',score);trackM('level',level);trackM('time',Math.floor(aliveT));
  drawHUD(score,highScore,level,fuel,spd,shT,boT,slT,nightLv);
  drawMissionBar(mission,mProg[mission?.key]);

  // low fuel warning
  if(fuel<25){blinkT+=dt;if(Math.floor(blinkT/22)%2===0){ctx.fillStyle='#ff2200';ctx.font='bold 10px Orbitron,monospace';ctx.textAlign='center';ctx.shadowColor='#ff0000';ctx.shadowBlur=8;ctx.fillText('\u26A0 LOW FUEL \u26A0',BW/2,BH-8);ctx.shadowBlur=0;}}else blinkT=0;

  if(crash){
    explosions.push({x:playerX,y:PLY,frame:0});
    shakePow=14;shakeT=22;vib([60,30,120,30,200]);beep('crash');
    setTimeout(endGame,220);state=S.GAMEOVER;
  }
}

// ═══════════════════════════════════════════════════════
// SERVER SCORE SUBMISSION
// ═══════════════════════════════════════════════════════
async function submitScoreToServer(sc, coins, lv){
  const token = localStorage.getItem('rr_token');
  if(!token) return; // guest mode
  try{
    await fetch('/api/scores', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body: JSON.stringify({score:sc, coins:coins, level:lv})
    });
  }catch(e){}
}

function endGame(){
  const isRec=score>highScore;
  if(isRec)highScore=score;
  saveS({hs:highScore,coins:totalCoins});addLB(score);submitScoreToServer(score,sesCoins,level);
  shakeT=0;canvas.style.transform='';
  try{navigator.vibrate&&navigator.vibrate(0);}catch(e){}
  if(engineGain)engineGain.gain.value=0;
  state=S.GAMEOVER;
  setTimeout(()=>drawGameOver(score,highScore,isRec,sesCoins),280);
}

// ═══════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════
drawStart();
(function animStart(){if(state!==S.START)return;requestAnimationFrame(animStart);drawStart();})();
</script>
